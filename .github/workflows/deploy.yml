name: Deploy

# Builds the dashboard on every push to main and publishes it to GitHub Pages at /crucible-dashboard/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generated data is never committed. CRUCIBLE_READ_TOKEN is only needed while the Crucible and
      # site repos are private; without it the default token is used.
      - name: Generate site data
        uses: ./.github/actions/site-data
        with:
          token: ${{ secrets.CRUCIBLE_READ_TOKEN || github.token }}

      - name: Check, test and build
        run: |
          npm run check
          npm test
          npm run build

      # index.json (current suite) <= 100 KB gzip; first-load JS+CSS for / <= 150 KB gzip
      - name: Size budget
        run: npm run size

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
